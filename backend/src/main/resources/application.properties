server.port=8080

# ==========================================
# Redis Distributed Cache Configuration
# ==========================================
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=6379

# ==========================================
# PostgreSQL Database Integration
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cinema_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:qwerty}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ==========================================
# AWS SQS Messaging Infrastructure
# ==========================================
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID:default}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:default}
spring.cloud.aws.region.static=us-east-1
spring.cloud.aws.sqs.enabled=false

# ==========================================
# Dynamic CORS Security Configuration
# ==========================================
# Injects the GitHub secret in production, defaults to Amplify and Localhost
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://main.d1rbc8rapzesm6.amplifyapp.com,http://localhost:5173}